name: Keep Supabase awake

# Free-tier Supabase projects pause after 7 days without database activity.
# This runs daily rather than weekly so a delayed or skipped run (GitHub makes
# no punctuality guarantee for cron) still leaves several chances inside the
# 7-day window.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are not set"
            exit 1
          fi

          code=$(curl -sS -X POST \
            --max-time 60 \
            --retry 3 --retry-delay 20 --retry-connrefused \
            -o response.json -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping")

          echo "HTTP ${code}"
          cat response.json
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::Keepalive ping failed (HTTP ${code}) — project may pause after 7 days"
            exit 1
          fi

          echo "::notice::Database pinged, inactivity timer reset"
